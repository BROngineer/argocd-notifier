name: "Renovate"

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: renovatebot/github-action@1376d90bcd3a4d4e7393ae762eea56ac684aee38 # v48.0.0
        with:
          token: ${{ secrets.AUTOMATION_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
