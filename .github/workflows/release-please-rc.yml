name: "Release Please RC"

on:
  push:
    branches:
      - main
    paths:
      - "**/*.go"
      - "go.mod"
      - "go.sum"
      - "Dockerfile"
      - "chart/**"

permissions:
  contents: write
  pull-requests: write

jobs:
  # we'll check whether the merged branch is the release branch
  # and skip rc creation in this case
  detect-merge-source:
    runs-on: ubuntu-latest
    outputs:
      create-rc: ${{ steps.check.outputs.create-rc }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          HEAD_REF=$(gh api "repos/${GH_REPO}/commits/${{ github.sha }}/pulls" --jq '.[0].head.ref // empty')
          if [[ "$HEAD_REF" == "release-please--branches--main--components--release" ]]; then
            echo "create-rc=false" >> "$GITHUB_OUTPUT"
          else
            echo "create-rc=true" >> "$GITHUB_OUTPUT"
          fi

  release-please-rc:
    needs: detect-merge-source
    if: fromJSON(needs.detect-merge-source.outputs.create-rc)
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: create-pr
        with:
          config-file: release-please-rc-config.json
          manifest-file: .release-please-rc-manifest.json
          token: ${{ secrets.AUTOMATION_TOKEN }}
          target-branch: main

      - if: ${{ steps.create-pr.outputs.pr }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_JSON: ${{ steps.create-pr.outputs.pr }}
        run: |
          PR_NUMBER=$(jq -r '.number' <<< "$PR_JSON")
          MAX_ATTEMPTS=10
          attempt=1
          STATE=""
          while (( attempt <= MAX_ATTEMPTS )); do
            STATE=$(gh pr view "$PR_NUMBER" --json mergeStateStatus --jq '.mergeStateStatus')
            if [[ "$STATE" == "CLEAN" ]]; then
              break
            fi
            sleep 5
            attempt=$(( attempt + 1 ))
          done

          if [[ "$STATE" != "CLEAN" ]]; then
            echo "Error: PR ${PR_NUMBER} is not mergeable (state: ${STATE:-<empty>})"
            exit 1
          fi

          echo "Info: merging PR ${PR_NUMBER}"
          gh pr merge "$PR_NUMBER" --squash --delete-branch
