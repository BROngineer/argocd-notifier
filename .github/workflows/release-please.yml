name: "Release Please"

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  # we'll check whether the merged branch is the release branch
  # and skip rc creation in this case
  detect-merge-source:
    runs-on: ubuntu-latest
    outputs:
      create-rc: ${{ steps.check.outputs.create-rc }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          HEAD_REF=$(gh api "repos/${GH_REPO}/commits/${{ github.sha }}/pulls" --jq '.[0].head.ref // empty')
          if [[ "$HEAD_REF" == "release-please--branches--main--components--release" ]]; then
            echo "create-rc=false" >> "$GITHUB_OUTPUT"
          else
            echo "create-rc=true" >> "$GITHUB_OUTPUT"
          fi

  release-please-rc:
    needs: detect-merge-source
    if: fromJSON(needs.detect-merge-source.outputs.create-rc)
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: create-pr
        with:
          config-file: release-please-rc-config.json
          manifest-file: .release-please-rc-manifest.json
          token: ${{ secrets.AUTOMATION_TOKEN }}
          target-branch: main

      - if: ${{ steps.create-pr.outputs.pr }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_JSON: ${{ steps.create-pr.outputs.pr }}
        run: |
          PR_NUMBER=$(jq -r '.number' <<< "$PR_JSON")
          MAX_ATTEMPTS=10
          attempt=1
          STATE=""
          while (( attempt <= MAX_ATTEMPTS )); do
            STATE=$(gh pr view "$PR_NUMBER" --json mergeStateStatus --jq '.mergeStateStatus')
            if [[ "$STATE" == "CLEAN" ]]; then
              break
            fi
            sleep 5
            attempt=$(( attempt + 1 ))
          done

          if [[ "$STATE" != "CLEAN" ]]; then
            echo "Error: PR ${PR_NUMBER} is not mergeable (state: ${STATE:-<empty>})"
            exit 1
          fi

          echo "Info: merging PR ${PR_NUMBER}"
          gh pr merge "$PR_NUMBER" --squash --delete-branch

  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        id: release-pr
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.AUTOMATION_TOKEN }}
          target-branch: main

      - if: ${{ steps.release-pr.outputs.pr }}
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_JSON: ${{ steps.release-pr.outputs.pr }}
        run: |
          HEAD_REF=$(jq -r '.headBranchName' <<< "$PR_JSON")

          MAIN_RC_VERSION=$(gh api "repos/$GH_REPO/contents/.release-please-rc-manifest.json?ref=main" --jq '.content' | base64 -d | jq -r '.["."]')
          MAIN_RC_CORE="${MAIN_RC_VERSION%%-*}"

          PR_FILE=$(gh api "repos/$GH_REPO/contents/.release-please-rc-manifest.json?ref=$HEAD_REF")
          PR_RC_VERSION=$(jq -r '.content' <<< "$PR_FILE" | base64 -d | jq -r '.["."]')

          if [[ "$PR_RC_VERSION" == "$MAIN_RC_VERSION" ]]; then
            echo "Info: rc manifest unchanged in this PR"
            exit 0
          fi

          if [[ "$(printf '%s\n%s' "$MAIN_RC_CORE" "$PR_RC_VERSION" | sort -V | tail -n1)" != "$MAIN_RC_CORE" ]]; then
            echo "Info: rc manifest bump is forward (or equal core), leaving as-is"
            exit 0
          fi

          echo "Info: reverting backward rc manifest bump ($PR_RC_VERSION -> keeping $MAIN_RC_VERSION)"
          FILE_SHA=$(jq -r '.sha' <<< "$PR_FILE")
          MAIN_CONTENT_B64=$(gh api "repos/$GH_REPO/contents/.release-please-rc-manifest.json?ref=main" --jq '.content')

          gh api --method PUT "repos/$GH_REPO/contents/.release-please-rc-manifest.json" \
            -f message="chore: keep rc manifest baseline, avoid regressing rc line" \
            -f content="$MAIN_CONTENT_B64" \
            -f branch="$HEAD_REF" \
            -f sha="$FILE_SHA"
