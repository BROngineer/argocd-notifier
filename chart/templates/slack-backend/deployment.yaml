{{- if .Values.slackBackend.enabled }}
{{- if not (or .Values.slackBackend.slack.botToken .Values.slackBackend.slack.existingSecret) }}
{{ fail "one of slackBackend.slack.botToken or slackBackend.slack.existingSecret must be set when slackBackend.enabled=true" }}
{{- end }}
{{- if and .Values.slackBackend.messageTemplate.content .Values.slackBackend.messageTemplate.existingConfigMap }}
{{ fail "set at most one of slackBackend.messageTemplate.content or slackBackend.messageTemplate.existingConfigMap" }}
{{- end }}
{{- $messageTemplateEnabled := or .Values.slackBackend.messageTemplate.content .Values.slackBackend.messageTemplate.existingConfigMap }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "argocd-notifier.slackBackendFullname" . }}
  labels:
    {{- include "argocd-notifier.slackBackendLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.slackBackend.replicaCount }}
  selector:
    matchLabels:
      {{- include "argocd-notifier.slackBackendSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.slackBackend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "argocd-notifier.slackBackendSelectorLabels" . | nindent 8 }}
        {{- with .Values.slackBackend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      containers:
        - name: slack-backend
          image: "{{ .Values.slackBackend.image.repository }}:{{ include "argocd-notifier.slackBackendImageTag" . }}"
          imagePullPolicy: {{ .Values.slackBackend.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ trimPrefix ":" .Values.slackBackend.listenAddr | int }}
              protocol: TCP
          env:
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "argocd-notifier.slackBackendSecretName" . }}
                  key: {{ include "argocd-notifier.slackBackendSecretKey" . }}
            - name: SLACK_REQUEST_TIMEOUT
              value: {{ .Values.slackBackend.slack.requestTimeout | quote }}
            - name: SLACK_MAX_RETRIES
              value: {{ .Values.slackBackend.slack.maxRetries | quote }}
            - name: LISTEN_ADDR
              value: {{ .Values.slackBackend.listenAddr | quote }}
            - name: CORE_URL
              value: {{ include "argocd-notifier.coreURL" . | quote }}
            - name: PUBLIC_BASE_URL
              value: {{ include "argocd-notifier.slackBackendPublicBaseURL" . | quote }}
            - name: BACKEND_NAME
              value: {{ .Values.slackBackend.backendName | quote }}
            - name: REGISTER_INTERVAL
              value: {{ .Values.slackBackend.registerInterval | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.slackBackend.logging.level | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.slackBackend.logging.format | quote }}
            {{- if $messageTemplateEnabled }}
            - name: MESSAGE_TEMPLATE_PATH
              value: "/etc/argocd-notifier/message-template/{{ include "argocd-notifier.slackBackendMessageTemplateConfigMapKey" . }}"
            - name: MESSAGE_TEMPLATE_RELOAD_INTERVAL
              value: {{ .Values.slackBackend.messageTemplate.reloadInterval | quote }}
            - name: MESSAGE_TEMPLATE_FALLBACK_TO_DEFAULT
              value: {{ .Values.slackBackend.messageTemplate.fallbackToDefault | quote }}
            {{- end }}
            {{- with .Values.slackBackend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.slackBackend.resources | nindent 12 }}
          {{- if $messageTemplateEnabled }}
          volumeMounts:
            - name: message-template
              mountPath: /etc/argocd-notifier/message-template
              readOnly: true
          {{- end }}
      {{- if $messageTemplateEnabled }}
      volumes:
        - name: message-template
          configMap:
            name: {{ include "argocd-notifier.slackBackendMessageTemplateConfigMapName" . }}
      {{- end }}
      {{- with .Values.slackBackend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.slackBackend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.slackBackend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
