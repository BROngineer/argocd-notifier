{{- if .Values.slackBackend.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "argocd-notifier.slackBackendFullname" . }}
  labels:
    {{- include "argocd-notifier.slackBackendLabels" . | nindent 4 }}
spec:
  type: {{ .Values.slackBackend.service.type }}
  ports:
    - port: {{ .Values.slackBackend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "argocd-notifier.slackBackendSelectorLabels" . | nindent 4 }}
{{- end }}
