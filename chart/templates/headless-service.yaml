{{- if .Values.leaderElection.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "argocd-notifier.headlessServiceName" . }}
  labels:
    {{- include "argocd-notifier.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "argocd-notifier.selectorLabels" . | nindent 4 }}
{{- end }}
