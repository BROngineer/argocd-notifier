{{- if not (or .Values.slack.botToken .Values.slack.existingSecret) }}
{{ fail "one of slack.botToken or slack.existingSecret must be set" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "argocd-notifier.fullname" . }}
  labels:
    {{- include "argocd-notifier.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "argocd-notifier.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "argocd-notifier.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "argocd-notifier.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: LISTEN_ADDR
              value: {{ .Values.server.listenAddr | quote }}
            - name: EVENTS_PATH
              value: {{ .Values.server.eventsPath | quote }}
            - name: INGEST_QUEUE_SIZE
              value: {{ .Values.server.ingestQueueSize | quote }}
            - name: WORKER_COUNT
              value: {{ .Values.server.workerCount | quote }}
            - name: GROUP_LABEL
              value: {{ .Values.aggregation.groupLabel | quote }}
            - name: IDLE_WINDOW
              value: {{ .Values.aggregation.idleWindow | quote }}
            - name: MAX_WAIT
              value: {{ .Values.aggregation.maxWait | quote }}
            - name: COMBINE_TRIGGERS
              value: {{ .Values.aggregation.combineTriggers | quote }}
            - name: SESSION_TTL
              value: {{ .Values.aggregation.sessionTTL | quote }}
            - name: DUPLICATE_ACTION
              value: {{ .Values.aggregation.duplicateAction | quote }}
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "argocd-notifier.slackSecretName" . }}
                  key: {{ include "argocd-notifier.slackSecretKey" . }}
            - name: SLACK_REQUEST_TIMEOUT
              value: {{ .Values.slack.requestTimeout | quote }}
            - name: SLACK_MAX_RETRIES
              value: {{ .Values.slack.maxRetries | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logging.level | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.logging.format | quote }}
            - name: LEADER_ELECTION_ENABLED
              value: {{ .Values.leaderElection.enabled | quote }}
            {{- if .Values.leaderElection.enabled }}
            - name: LEADER_ELECTION_NAMESPACE
              value: {{ include "argocd-notifier.leaderElectionNamespace" . | quote }}
            - name: LEASE_NAME
              value: {{ .Values.leaderElection.leaseName | quote }}
            - name: LEASE_DURATION
              value: {{ .Values.leaderElection.leaseDuration | quote }}
            - name: RENEW_DEADLINE
              value: {{ .Values.leaderElection.renewDeadline | quote }}
            - name: RETRY_PERIOD
              value: {{ .Values.leaderElection.retryPeriod | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
