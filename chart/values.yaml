replicaCount: 1

image:
  repository: ghcr.io/brongineer/argocd-notifier/aggregation-engine
  tag: "v0.6.0" # x-release-please-version
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

service:
  type: ClusterIP
  port: 8080

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}

# Extra env vars (e.g. secretKeyRef/valueFrom), same shape as a Pod's env: list.
extraEnv: []

server:
  listenAddr: ":8080"
  ingestQueueSize: 1024
  workerCount: 4

# Debounces events sharing groupLabel's value into one aggregated
# notification per rollout, instead of one message per Application.
aggregation:
  # Label whose value groups Applications into one rollout (e.g. every
  # per-cluster Application of the same service shares this label).
  groupLabel: "application/name"
  # Resets on every new event for the group; the batch flushes once this
  # much time passes with no further events — unless maxWait fires first.
  idleWindow: "30s"
  # Hard cap on how long a busy/growing batch can be delayed: started once,
  # on the batch's first event, and never reset — guarantees a rollout's
  # first notification is never delayed indefinitely by continuous traffic.
  maxWait: "5m"
  # true: every trigger (on-deployed, on-health-degraded, ...) for the same
  # (groupLabel value, revision) shares one message/session. false: each
  # trigger gets its own separate message/session, even for the same
  # revision. Channel/recipient routing is independent of this either way —
  # it's driven by each event's own subscribe-annotation recipient, so
  # routing different triggers to different channels doesn't require false.
  combineTriggers: true
  # How long a (groupLabel value, revision) session stays "live" after its
  # last flush. Within this window, a new flush reuses the session's
  # existing state (cumulative — reflecting every app seen so far, not just
  # the latest batch) and updates the previous notification in place, if
  # the resolved backend supports editing (implements Updater or Notifier);
  # a backend that doesn't just gets a fresh notification every flush
  # regardless. After this window elapses, the session is discarded and the
  # next flush starts an entirely new one from scratch.
  sessionTTL: "45m"
  # What to do when an app reports the exact same state again (identical
  # trigger/revision/syncPhase/healthStatus/operationMessage) within an
  # existing session: "drop" silently ignores it (default) — the main
  # notification is already correct, so there's nothing to add; "thread"
  # posts one reply per repeated app under the existing notification
  # instead, without touching the main one. "thread" only has an effect if
  # the resolved backend implements ThreadReplier — otherwise it behaves
  # exactly like "drop", silently.
  duplicateAction: "drop"

# Every notification backend is a separate process that self-registers here
# — see docs/adding-a-backend.md and docs/remote-backends.md.
backendRegistry:
  # How long a backend's registration stays valid without a heartbeat.
  ttl: "90s"
  # Timeout for each call this process makes to a registered backend.
  requestTimeout: "5s"

logging:
  level: "info"
  format: "json"

leaderElection:
  enabled: false
  # Defaults to the release namespace when empty.
  namespace: ""
  leaseName: "argocd-notifier-leader"
  leaseDuration: "15s"
  renewDeadline: "10s"
  retryPeriod: "2s"
  # How long a non-leader replica waits for the leader's response headers
  # when forwarding a request to it (see design.md#high-availability).
  proxyRequestTimeout: "5s"

# net/http/pprof, on its own container port — deliberately not exposed via
# the Service; reach it with `kubectl port-forward`.
pprof:
  enabled: false
  addr: ":6060"

# The standalone Slack backend (cmd/slack-backend) — a separate workload
# that self-registers with the core above. Disabled by default: the core
# runs standalone and delivers nowhere until a backend registers, Slack or
# otherwise — see docs/adding-a-backend.md and docs/remote-backends.md.
slackBackend:
  enabled: false
  replicaCount: 1

  image:
    repository: ghcr.io/brongineer/argocd-notifier/slack-backend
    tag: "" # defaults to the chart's appVersion, same as image.tag above
    pullPolicy: IfNotPresent

  # Either set botToken (rendered into a Secret this chart creates) or
  # existingSecret (a Secret you manage yourself) — exactly one is required.
  slack:
    botToken: ""
    existingSecret: ""
    existingSecretKey: "SLACK_BOT_TOKEN"
    requestTimeout: "5s"
    maxRetries: 3

  listenAddr: ":8081"
  # Both default to this same release's own core/slack-backend Services —
  # only set these if you're pointing at a core (or running this backend)
  # outside this release.
  coreURL: ""
  publicBaseURL: ""
  # Must match the `application/backend` label value events route with.
  backendName: "slack"
  # Must stay comfortably under the core's backendRegistry.ttl above.
  registerInterval: "30s"

  # Custom Slack message template (see docs/slack-message-templates.md) —
  # optional; leaving content and existingConfigMap both empty (the default)
  # keeps the built-in per-trigger rendering unchanged. Set at most one of
  # content (rendered into a ConfigMap this chart creates) or
  # existingConfigMap (one you manage yourself), mirroring
  # slackBackend.slack.botToken/existingSecret above.
  #
  # The template is executed against a notification.Notification{Summary,
  # Items}, with Sprig functions available; it must define exactly two named
  # blocks, "text" (the message's top-level Slack text) and "attachments"
  # (raw JSON for the "attachments" array).
  #
  # Example 1 — simple, same look for every item:
  #   messageTemplate:
  #     content: |
  #       {{define "text"}}{{.Summary}}{{end}}
  #       {{define "attachments"}}
  #       [
  #       {{range $i, $item := .Items}}{{if $i}},{{end}}
  #         {"color":"#2eb1f2","blocks":[{"type":"section","fields":[
  #           {"type":"mrkdwn","text":"*App*\n{{$item.AppName}}"},
  #           {"type":"mrkdwn","text":"*Cluster*\n{{$item.Cluster}}"}
  #         ]}]}
  #       {{end}}
  #       ]
  #       {{end}}
  #
  # Example 2 — different rendering per trigger (branch on $item.Trigger),
  # collapsing to one summary attachment once there are many apps (a
  # template sees the whole Items list, so it can decide this itself):
  #   messageTemplate:
  #     content: |
  #       {{define "text"}}{{.Summary}}{{end}}
  #       {{define "attachments"}}
  #       {{if gt (len .Items) 8}}
  #       [{"color":"#2eb1f2","blocks":[{"type":"section","text":{"type":"mrkdwn",
  #         "text":"{{len .Items}} apps: {{range $i, $item := .Items}}{{if $i}}, {{end}}{{$item.AppName}}{{end}}"}}]}]
  #       {{else}}
  #       [
  #       {{range $i, $item := .Items}}{{if $i}},{{end}}
  #         {{if eq $item.Trigger "on-deployed"}}
  #           {"color":"#18be52","blocks":[{"type":"section","fields":[
  #             {"type":"mrkdwn","text":"*App*\n{{$item.AppName}}"},
  #             {"type":"mrkdwn","text":"*Commit*\n`{{$item.CommitSHA}}`"}
  #           ]}]}
  #         {{else if eq $item.Trigger "on-health-degraded"}}
  #           {"color":"#f4c030","blocks":[{"type":"section","fields":[
  #             {"type":"mrkdwn","text":"*App*\n{{$item.AppName}}"},
  #             {"type":"mrkdwn","text":"*Health*\n:large_yellow_circle: Degraded"}
  #           ]}]}
  #         {{end}}
  #       {{end}}
  #       ]
  #       {{end}}
  #       {{end}}
  #
  # Example 3 - message with one attachment, that collects target clusters,
  # revisions and initiators:
  #   messageTemplate:
  #     content: |
  #       {{define "text"}}:rocket: Application state update: {{.Summary}}{{end}}
  #       {{define "attachments"}}
  #       {{$revs := list}}
  #       {{$clusters := list}}
  #       {{$initiators := list}}
  #       {{$groupKey := index (splitList " — " .Summary) 0}}
  #       {{$argoBase := (index .Items 0).Link | trimSuffix (printf "/applications/%s" (index .Items 0).AppName)}}
  #       {{range $item := .Items}}
  #         {{$revs = append $revs $item.TargetRevision}}
  #         {{$clusters = append $clusters $item.Cluster}}
  #         {{$initiators = append $initiators $item.TriggeredBy}}
  #       {{end}}
  #       [{"color":"#18be52","blocks":[
  #         {"type":"section","text":{"type":"mrkdwn","text":"*Clusters*: `{{$clusters | uniq | join ", "}}`"}},
  #         {"type":"section","text":{"type":"mrkdwn","text":"*Deployed Revisions*: `{{$revs | uniq | join ", "}}`"}},
  #         {"type":"section","text":{"type":"mrkdwn","text":"*Triggered By*: `{{$initiators | uniq | join ", "}}`"}},
  #         {"type":"actions","elements":[
  #           {"type":"button","text":{"type":"plain_text","text":"Open in ArgoCD"},"url":"{{$argoBase}}/applications?labels=application%2Fname%3D{{$groupKey}}"}
  #         ]}
  #       ]}]
  #       {{end}}
  #
  messageTemplate:
    content: ""
    existingConfigMap: ""
    existingConfigMapKey: "message.tmpl"
    reloadInterval: "30s"
    # When the template fails to render a specific notification: true falls
    # back to the built-in rendering so the message still gets sent; false
    # logs and drops just that notification instead.
    fallbackToDefault: false

  logging:
    level: "info"
    format: "json"

  service:
    type: ClusterIP
    port: 8081

  podAnnotations: {}
  podLabels: {}
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  extraEnv: []
